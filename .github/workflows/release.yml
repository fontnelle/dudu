name: Release (Windows)

# The Windows edition is released from the windows branch as win-vX.Y.Z. These releases are
# never marked "latest", which stays the macOS/Linux edition's, and they do not touch the
# Homebrew tap.
on:
  push:
    tags: ["win-v*"]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags, for the "Full Changelog" link
      - name: Check tag matches VERSION and CHANGELOG
        run: |
          v=$(sed -n 's/^VERSION="\(.*\)"/\1/p' dudu)
          [ "win-v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != VERSION $v"; exit 1; }
          packaging/release-notes.sh --title "$v"
      - name: Build
        run: |
          v=${GITHUB_REF_NAME#win-v}
          mkdir -p dist
          git archive --format=tar.gz --prefix=dudu-$v/ -o dist/dudu-$v.tar.gz HEAD
          cd dist && sha256sum dudu-$v.tar.gz > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#win-v}
          packaging/release-notes.sh "$v" > dist/notes.md
          gh release create "$GITHUB_REF_NAME" dist/dudu-$v.tar.gz dist/SHA256SUMS --latest=false \
            --title "$(packaging/release-notes.sh --title "$v")" --notes-file dist/notes.md
