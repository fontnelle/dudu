name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    env:
      # A fine-grained token with Contents: write on fontnelle/homebrew-tap only.
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags, for the "Full Changelog" link
      - name: Check tag matches VERSION and CHANGELOG
        run: |
          v=$(sed -n 's/^VERSION="\(.*\)"/\1/p' dudu)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != VERSION $v"; exit 1; }
          packaging/release-notes.sh --title "$v"
      - name: Build
        run: |
          v=${GITHUB_REF_NAME#v}
          mkdir -p dist
          git archive --format=tar.gz --prefix=dudu-$v/ -o dist/dudu-$v.tar.gz HEAD
          cd dist && sha256sum dudu-$v.tar.gz > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          packaging/release-notes.sh "$v" > dist/notes.md
          gh release create "$GITHUB_REF_NAME" dist/dudu-$v.tar.gz dist/SHA256SUMS \
            --title "$(packaging/release-notes.sh --title "$v")" --notes-file dist/notes.md
      - name: Update the Homebrew tap
        if: env.TAP_TOKEN != ''
        run: |
          v=${GITHUB_REF_NAME#v}
          sha=$(cut -d' ' -f1 dist/SHA256SUMS)
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/fontnelle/homebrew-tap.git" tap
          mkdir -p tap/Formula
          sed -e "s/@VERSION@/$v/g" -e "s/@SHA256@/$sha/" packaging/homebrew/dudu.rb > tap/Formula/dudu.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/dudu.rb
          git commit -m "⬆️ build: dudu $v"
          git push
