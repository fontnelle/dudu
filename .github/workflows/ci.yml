name: CI

on:
  push:
    branches: [main, windows]
  pull_request:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck bats-core
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats
      - run: make lint
      - run: make test
      - name: Smoke test
        env:
          DUDU_NO_UPDATE_CHECK: "1"
          NO_COLOR: "1"
        run: |
          ./dudu --version
          ./dudu backup --only shell,git
          ./dudu restore --dry-run --only shell,git
          ./dudu status --only shell,git
      - name: Smoke test (a Mac backup restored on Linux)
        if: runner.os == 'Linux'
        env:
          DUDU_NO_UPDATE_CHECK: "1"
          NO_COLOR: "1"
        run: ./dudu restore --file tests/fixtures/mac-bundle --dry-run -y

  # Git Bash on Windows: the edition this branch is for.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    # Every step runs even after one fails: a run shows all that is wrong on Windows at once.
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats"
          echo "$RUNNER_TEMP/bats/bin" >> "$GITHUB_PATH"
          choco install -y --no-progress shellcheck make
      - run: make lint
      # Not make test: Windows' make hands bats a D:/ path, and bats wants /d/.
      - run: bats tests/
      - name: Smoke test
        if: ${{ !cancelled() }}
        env:
          DUDU_NO_UPDATE_CHECK: "1"
          NO_COLOR: "1"
        run: |
          ./dudu --version
          ./dudu backup --only shell,git,terminal,winget
          ./dudu restore --dry-run --only shell,git,terminal
          ./dudu status --only shell,git,terminal
      - name: Real Windows APIs (registry, Credential Manager, Task Scheduler)
        if: ${{ !cancelled() }}
        env:
          DUDU_REAL_WINDOWS: "1"
        run: bats tests/windows_real.bats
      - name: Smoke test (a Mac backup restored on Windows)
        if: ${{ !cancelled() }}
        env:
          DUDU_NO_UPDATE_CHECK: "1"
          NO_COLOR: "1"
        run: ./dudu restore --file tests/fixtures/mac-bundle --dry-run -y
      - name: Installer in Git Bash (this checkout)
        if: ${{ !cancelled() }}
        run: |
          bash -n install.sh
          bash install.sh --source "$PWD"
          "$HOME/bin/dudu" --version
          # dudu update replaces dudu while it runs, and Windows keeps a folder in use from
          # being renamed: the installer must still go through.
          ( cd "$HOME/.local/share/dudu" && exec 9< dudu && sleep 30 ) &
          sleep 1
          bash install.sh --source "$PWD"
          "$HOME/bin/dudu" --version
          ./dudu schedule status
      - name: The scheduled backup's hidden launcher makes a backup
        if: ${{ !cancelled() }}
        env:
          DUDU_NO_UPDATE_CHECK: "1"
          NO_COLOR: "1"
        run: |
          # A Windows path, as a user would type it.
          ./dudu config set destination local
          ./dudu config set path "$RUNNER_TEMP\\scheduled backups"
          ./dudu config set include shell,git
          ./dudu schedule on 23:58
          # Not "| grep -q": it stops reading early, and pipefail then fails the step.
          st=$(./dudu schedule status)
          case "$st" in *23:58*) ;; *) echo "$st"; exit 1 ;; esac
          dest="$(cygpath -u "$RUNNER_TEMP")/scheduled backups"
          # What the task runs, started the way Task Scheduler starts it.
          wscript.exe "$(cygpath -w "$HOME/.config/dudu/scheduled-backup.vbs")"
          for _ in $(seq 60); do
            ls "$dest"/*/latest >/dev/null 2>&1 && break
            sleep 2
          done
          ls "$dest"/*/latest || { tail -40 "$HOME/.cache/dudu/dudu.log"; exit 1; }
          ./dudu schedule off
      - name: install.ps1 from Windows PowerShell, then dudu from PowerShell and cmd
        if: ${{ !cancelled() }}
        shell: powershell
        env:
          DUDU_NO_UPDATE_CHECK: "1"
          NO_COLOR: "1"
        run: |
          $env:DUDU_SOURCE = "$PWD"
          # As irm ... | iex runs it: the text of the script, not a file.
          Get-Content -Raw .\install.ps1 | Invoke-Expression
          $v = dudu --version
          if ("$v" -notmatch '^dudu \d') { throw "dudu did not run from PowerShell: $v" }
          $v = cmd /c "dudu --version"
          if ("$v" -notmatch '^dudu \d') { throw "dudu did not run from cmd: $v" }
          cmd /c "dudu backup --only shell"
          if ($LASTEXITCODE -ne 0) { throw "dudu backup failed from cmd" }
      - name: install.ps1 from PowerShell 7, for a user folder with an accent and a space
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          DUDU_NO_UPDATE_CHECK: "1"
          NO_COLOR: "1"
        run: |
          $u = Join-Path $env:RUNNER_TEMP "João Silva"
          New-Item -ItemType Directory -Force "$u\AppData\Local", "$u\AppData\Roaming" | Out-Null
          $env:USERPROFILE = $u; $env:HOME = $u
          $env:LOCALAPPDATA = "$u\AppData\Local"; $env:APPDATA = "$u\AppData\Roaming"
          $env:DUDU_SOURCE = "$PWD"
          Get-Content -Raw .\install.ps1 | Invoke-Expression
          $shim = "$env:LOCALAPPDATA\dudu\bin\dudu.cmd"
          $v = & $shim --version
          if ("$v" -notmatch '^dudu \d') { throw "dudu.cmd did not run from PowerShell: $v" }
          $v = cmd /c "`"$shim`" --version"
          if ("$v" -notmatch '^dudu \d') { throw "dudu.cmd did not run from cmd: $v" }
          & $shim backup --only shell
          if ($LASTEXITCODE -ne 0) { throw "dudu backup failed" }

  # macOS ships bash 3.2 as /bin/bash: dudu must keep working there.
  bash32:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install bats-core
      - name: Tests under /bin/bash 3.2
        run: |
          mkdir -p "$RUNNER_TEMP/b32"
          ln -sf /bin/bash "$RUNNER_TEMP/b32/bash"
          export PATH="$RUNNER_TEMP/b32:$PATH"
          bash --version | head -1
          bats tests/

  # syspkgs reads dnf and pacman too.
  distros:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:latest
            setup: dnf install -y bats make git findutils procps-ng diffutils which openssl perl tar gzip
          - image: archlinux:latest
            setup: pacman -Syu --noconfirm bats make git findutils procps-ng diffutils which openssl perl tar gzip
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - run: ${{ matrix.setup }}
      - uses: actions/checkout@v4
      - run: make test
      - name: Smoke test
        env:
          DUDU_NO_UPDATE_CHECK: "1"
          NO_COLOR: "1"
        run: |
          ./dudu backup --only syspkgs,shell
          ./dudu status --only syspkgs,shell
          ./dudu restore --file tests/fixtures/mac-bundle --dry-run -y
